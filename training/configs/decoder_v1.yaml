# Deterministic decoder contract. These are validation-search starting values,
# not clinical or product thresholds, until a locked calibration artifact exists.
version: decoder.v1
start_threshold: 0.65
end_threshold: 0.65
phase_threshold: 0.45
tracking_floor: 0.60
low_tracking_frames: 30
max_timestamp_gap_ms: 500
min_rep_duration_ms: 300
max_rep_duration_ms: 15000
refractory_ms: 300
min_phase_frames: 2
require_apex: true
apex_phase_ids: [3]
